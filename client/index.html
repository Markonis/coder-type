  <script src="index.js" defer></script>

  <style>
    typing-panel:focus-within .typing-current {
      border-bottom: 1px solid white;
    }

    .typing-error {
      background-color: #F008;
    }
  </style>
</head>
<body data-bs-theme="dark">
  <div class="container p-4">
    <h1>CoderType 2.0</h1>
    <blockquote>
      Talk is cheap. Show me the code!
      <cite>- Linus Torvalds</cite>
    </blockquote>
    <div class="card">
      <div class="card-header">
        <div class="row align-items-center">
          <label for="snippet" class="col-2 text-nowrap">Snippet</label>
          <snippet-select class="col-10"></snippet-select>
        </div>
        <div class="row">
          <div class="col-2">URL</div>
          <div class="col-10">
            <a id="snippet-url" class="small text-secondary" target="_blank"></a>
          </div>
        </div>
      </div>
      <div class="card-body">
        <typing-panel class="overflow-hidden"></typing-panel>
      </div>
      <div class="card-footer font-monospace small">
        <typing-tracker></typing-tracker>
      </div>
    </div>
    <footer class="mt-2">
      <p class="text-secondary small">
        Legal notice: the above code snippets are taken for educational purposes
        from their respective repositories. Please follow the provided links
        to get information about the license of each snippet.
      </p>
    </footer>
  </div>

  <div class="modal fade" id="report-modal" tabindex="-1" aria-labelledby="reportLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="reportLabel">Report</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <report-view></report-view>
        </div>
        <div class="modal-footer">
          <button id="retry" tabindex="0" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Retry</button>
          <button id="next" tabindex="0" type="button" class="btn btn-primary" data-bs-dismiss="modal">Next Example</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
